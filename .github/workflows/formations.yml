name: Formations

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: List formations
    runs-on: ubuntu-latest
    outputs:
      formations: ${{ steps.list.outputs.formations }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: List formations
        id: list
        run: |
          formations=$(scripts/prod/list-formations.sh | jq -sc .)
          echo "$formations"
          echo "formations=$formations" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.dir }}
    needs: detect
    if: needs.detect.outputs.formations != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.formations) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: matrix.kind == 'vite'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        if: matrix.kind == 'vite'
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
            echo "PM=pnpm" >> "$GITHUB_ENV"
          elif [ -f package-lock.json ]; then
            npm ci
            echo "PM=npm" >> "$GITHUB_ENV"
          else
            npm install
            echo "PM=npm" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: |
          if [ "${{ matrix.kind }}" = pdf ]; then
            "$GITHUB_WORKSPACE/scripts/prod/build-pdf.sh" . dist
          else
            $PM run build
            # Métadonnées pour la page d'accueil
            if [ -f formation.json ]; then cp formation.json dist/; fi
          fi

      - name: Stage artifact
        run: |
          mkdir -p "$(dirname "$GITHUB_WORKSPACE/site/${{ matrix.slug }}")"
          cp -r dist "$GITHUB_WORKSPACE/site/${{ matrix.slug }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: formation-${{ matrix.id }}
          path: site/

  deploy:
    name: Deploy formations.clubcode.fr
    needs: [detect, build]
    if: ${{ !cancelled() && needs.detect.result == 'success' && needs.build.result != 'skipped' }}
    runs-on: [self-hosted, formations]
    timeout-minutes: 5
    concurrency:
      group: formations-production-deploy
      cancel-in-progress: false

    steps:
      - name: Clean workspace
        run: rm -rf site dist

      - name: Check out scripts
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/prod

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: formation-*
          path: site
          merge-multiple: true

      - name: Deploy artifacts to web root
        run: |
          deployed=0
          # Formations dans site/<année>/<nom>/
          for dir in site/*/*/; do
            [ -f "$dir/index.html" ] || continue
            slug=${dir#site/}
            slug=${slug%/}
            mkdir -p "/var/www/formations/$slug"
            rsync -a --delete "$dir" "/var/www/formations/$slug/"
            echo "Déployé : /$slug/"
            deployed=$((deployed + 1))
          done
          if [ "$deployed" -eq 0 ]; then
            echo "Aucune formation trouvée dans site/ :"
            find site -maxdepth 3
            exit 1
          fi
      - name: Remove old formations
        env:
          FORMATIONS: ${{ needs.detect.outputs.formations }}
        run: |
          keep=$(jq -r '.[].slug' <<<"$FORMATIONS")
          if [ -z "$keep" ]; then
            echo "Liste des formations vide, nettoyage ignoré"
            exit 0
          fi
          for dir in /var/www/formations/*/; do
            year=$(basename "$dir")
            [ "$year" = _home ] && continue
            if ! grep -q "^$year/" <<<"$keep"; then
              rm -rf -- "/var/www/formations/$year"
              echo "Supprimé : /$year/"
              continue
            fi
            for sub in "$dir"*/; do
              [ -d "$sub" ] || continue
              slug=$year/$(basename "$sub")
              grep -qxF "$slug" <<<"$keep" && continue
              rm -rf -- "/var/www/formations/$slug"
              echo "Supprimé : /$slug/"
            done
          done

      - name: Generate index page
        run: scripts/prod/generate-index.sh /var/www/formations
